<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prepify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/search.css" />
</head>
<body>
  <!-- ===== Home: centered search, like a search engine ===== -->
  <main id="home" class="home">
    <nav class="corner"><a href="/workspace">workspace</a></nav>
    <div class="home-inner">
      <div class="wordmark"><span class="dim">prep</span>ify</div>
      <p class="tagline">interview intel for any company, with a source on every question</p>

      <form id="home-form" class="searchbar big" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="home-q" name="q" aria-label="Search" placeholder="target corporation interview questions" autofocus />
        <button type="button" class="pill" id="home-research-pill" title="Search and pull Glassdoor and AmbitionBox into Prepify">
          <span class="key">/</span>research
        </button>
      </form>

      <div class="home-actions">
        <button type="submit" form="home-form" class="btn">search</button>
        <button type="button" id="home-research" class="btn">research sources</button>
      </div>

      <p class="promo">tip: pages you save with the prepify extension show up in your results &middot; <a href="/workspace">workspace</a></p>
      <p class="offered">try:
        <button class="example" type="button">Target Corporation interview questions</button>
        <button class="example" type="button">Accenture ASE interview process</button>
        <button class="example" type="button">TCS Ninja HR questions</button>
      </p>
    </div>
  </main>

  <!-- ===== Results ===== -->
  <div id="results" class="results hidden">
    <header class="topbar">
      <a href="/" class="wordmark small" id="logo-home"><span class="dim">prep</span>ify</a>
      <form id="top-form" class="searchbar" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="top-q" name="q" />
      </form>
      <a href="/workspace" class="toplink">workspace</a>
    </header>

    <nav class="filters" id="filters">
      <button class="filter active" data-filter="all">all</button>
      <button class="filter" data-filter="questions">questions</button>
      <button class="filter" data-filter="reviews">reviews</button>
      <button class="filter" data-filter="sources">sources</button>
    </nav>

    <div class="layout">
      <div class="main-col">
        <p class="understood" id="understood"></p>
        <div id="report"></div>
      </div>
      <aside class="side-col" id="panel"></aside>
    </div>
  </div>

  <script src="/static/search.js"></script>
</body>
</html>
